  --bg: #0a0e0d;
  --surface: #111816;
  --surface-2: #17211f;
  --line: #26322e;
  --text: #f2f6f3;
  --muted: #a7b8b0;
  --dim: #71837c;
  --cyan: #5eead4;
  --green: #86efac;
  --amber: #fcd34d;
  --cyan-soft: rgba(94, 234, 212, 0.12);
  --green-soft: rgba(134, 239, 172, 0.12);
  --amber-soft: rgba(252, 211, 77, 0.12);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0e0d;
    --surface: #111816;
    --surface-2: #17211f;
    --line: #26322e;
    --text: #f2f6f3;
    --muted: #a7b8b0;
    --dim: #71837c;
  }
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
}

.mono {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
}

.tab-card {
  transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease, background .25s ease;
}

.tab-card:hover {
  transform: translateY(-3px);
}

.tab-card:focus-visible {
  outline: 3px solid var(--text);
  outline-offset: 4px;
}

.cube-scene {
  perspective: 900px;
}

.cube {
  transform-style: preserve-3d;
  transform: rotateX(-24deg) rotateY(32deg);
  animation: slowTurn 18s ease-in-out infinite alternate;
}

@keyframes slowTurn {
  from {
    transform: rotateX(-24deg) rotateY(28deg);
  }

  to {
    transform: rotateX(-18deg) rotateY(40deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .cube {
    animation: none;
  }

  .tab-card, .tab-card:hover {
    transform: none;
  }
}

@media (min-width: 640px) {
  .sm\:h-\[190px\] {
    height: 190px;
  }

  .sm\:w-\[190px\] {
    width: 190px;
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:items-center {
    align-items: center;
  }

  .sm\:justify-between {
    justify-content: space-between;
  }

  .sm\:p-10 {
    padding: 2.5rem;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:p-7 {
    padding: 1.75rem;
  }

  .sm\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .sm\:pt-12 {
    padding-top: 3rem;
  }

  .sm\:text-\[16px\] {
    font-size: 16px;
  }

  .sm\:text-\[20px\] {
    font-size: 20px;
  }

  .sm\:text-\[32px\] {
    font-size: 32px;
  }

  .sm\:text-\[52px\] {
    font-size: 52px;
  }

  .sm\:text-\[72px\] {
    font-size: 72px;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:border-l {
    border-left-width: 1px;
  }

  .lg\:border-t-0 {
    border-top-width: 0px;
  }

  .lg\:text-\[88px\] {
    font-size: 88px;
  }
}
