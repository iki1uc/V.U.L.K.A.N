  --tw-invert: invert(100%);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

:root{
  --bg:#02060a;
  --surface:#071019;
  --surface2:#0b1824;
  --line:#1c2f3f;
  --gold:#e8b64c;
  --cyan:#37d5e8;
  --green:#4ade80;
  --red:#f87171;
  --text:#eef1e8;
  --muted:#93a7b4;
  --dim:#5e7380;
}

@media (prefers-color-scheme: light){
  :root{
    --bg:#02060a;
    --surface:#071019;
    --text:#eef1e8;
    --muted:#93a7b4;
  }
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size:16px;
  line-height:1.55;
}

button, input, label{
  font:inherit;
}

a{
  color:var(--cyan);
}

input[type="range"]{
  -webkit-appearance:none;
  -moz-appearance:none;
       appearance:none;
  width:100%;
  height:6px;
  border-radius:99px;
  background:#162736;
  outline:none;
}

input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--gold);
  border:3px solid #02060a;
  box-shadow:0 0 0 1px var(--gold);
  cursor:pointer;
}

input[type="range"]::-moz-range-thumb{
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--gold);
  border:3px solid #02060a;
  cursor:pointer;
}

canvas{
  max-width:100%;
  height:auto;
  display:block;
}

::-webkit-scrollbar{
  width:10px;
  height:10px;
}

::-webkit-scrollbar-thumb{
  background:#1c2f3f;
  border-radius:99px;
}

.hover\:border-\[var\(--gold\)\]:hover {
  border-color: var(--gold);
}

.hover\:text-\[var\(--gold\)\]:hover {
  color: var(--gold);
}

.hover\:brightness-110:hover {
  --tw-brightness: brightness(1.1);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

@media (min-width: 640px) {
  .sm\:w-auto {
    width: auto;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .sm\:text-\[38px\] {
    font-size: 38px;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:sticky {
    position: sticky;
  }

  .lg\:top-24 {
    top: 6rem;
  }

  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.7fr_1fr\] {
    grid-template-columns: 1.7fr 1fr;
  }

  .lg\:grid-cols-\[1fr_1\.4fr\] {
    grid-template-columns: 1fr 1.4fr;
  }

  .lg\:flex-row {
    flex-direction: row;
  }

  .lg\:items-center {
    align-items: center;
  }

  .lg\:justify-between {
    justify-content: space-between;
  }

  .lg\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }
}
