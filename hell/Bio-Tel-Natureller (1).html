:root{
  --paper:#faf7f0;
  --surface:#fffdf8;
  --ink:#2a2a2a;
  --muted:#6f6a5f;
  --line:#e5ddcd;
  --green:#5a8a5a;
  --gold:#b89a4a;
  --soft-green:#e8f0e6;
  --soft-gold:#f4edd8;
  --red:#b15a55;
}

@media (prefers-color-scheme: dark){
  :root{
    --paper:#211e19;
    --surface:#2b2721;
    --ink:#f1eadf;
    --muted:#bcb4a5;
    --line:#46403a;
    --green:#8bb78d;
    --gold:#d0b96f;
    --soft-green:#304135;
    --soft-gold:#443d2b;
    --red:#e08a82;
  }
}

*{
  box-sizing:border-box
}

html{
  background:var(--paper);
  color:var(--ink)
}

body{
  margin:0;
  min-width:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
  font-size:17px;
  line-height:1.75
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 18px 28px;
  background:var(--paper)
}

.topbar{
  max-width:1020px;
  margin:0 auto;
  padding:28px 4px 30px;
  display:flex;
  justify-content:space-between;
  gap:30px;
  align-items:end;
  border-bottom:1px solid var(--line)
}

.eyebrow{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--green);
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  margin:0 0 16px
}

h1{
  font-size:clamp(34px,5vw,56px);
  line-height:1.08;
  letter-spacing:-.035em;
  font-weight:400;
  margin:0;
  max-width:700px
}

h1 span{
  color:var(--muted);
  font-style:italic;
  font-weight:400
}

.formula-card{
  min-width:240px;
  background:var(--soft-gold);
  border-radius:18px;
  padding:18px 20px
}

.formula-card strong{
  display:block;
  font-size:20px;
  color:var(--ink)
}

.formula-card span{
  display:block;
  margin-top:8px;
  color:var(--muted);
  font-size:14px;
  line-height:1.5
}

main{
  max-width:1020px;
  margin:0 auto
}

.intro{
  padding:28px 4px 22px;
  display:grid;
  grid-template-columns:1.1fr 1fr;
  gap:34px
}

.intro>p{
  font-size:19px;
  line-height:1.7;
  margin:0
}

.mode-wrap{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px
}

.mode-wrap>span{
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
  font-weight:700;
  color:var(--ink)
}

.segmented{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:var(--paper);
  padding:4px;
  border-radius:999px;
  margin-top:12px
}

.segmented button{
  border:0;
  background:transparent;
  color:var(--muted);
  border-radius:999px;
  padding:11px 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:14px;
  font-weight:700
}

.segmented button.active{
  background:var(--green);
  color:white;
  box-shadow:0 4px 14px rgba(90,138,90,.25)
}

.segmented button.active.strong{
  background:#8d6e2b
}

.mode-note{
  font-size:13px;
  line-height:1.5;
  color:var(--muted);
  margin:12px 0 0
}

.images{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px
}

.photo-card{
  margin:0;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(60,50,35,.06)
}

.photo-card.tel{
  border-color:#c9d8c5
}

.photo-card figcaption{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 18px;
  font-family:Arial,Helvetica,sans-serif
}

.photo-card figcaption span{
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-size:13px
}

.photo-card figcaption small{
  color:var(--muted);
  font-size:13px
}

.photo-area{
  min-height:300px;
  background:#eee8da;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden
}

.photo-area canvas{
  width:100%;
  height:auto;
  display:block;
  max-height:520px;
  -o-object-fit:contain;
     object-fit:contain
}

.photo-area canvas.hide{
  display:none
}

.empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:8px;
  color:var(--muted);
  padding:40px 20px
}

.empty svg{
  color:var(--gold)
}

.empty strong{
  color:var(--ink);
  font-size:19px
}

.empty span{
  font-size:14px;
  line-height:1.5
}

.measure{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  margin-top:18px
}

.measure>div{
  background:var(--surface);
  padding:20px 22px
}

.measure small{
  display:block;
  font-family:Arial,Helvetica,sans-serif;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted)
}

.measure b{
  display:block;
  font-size:38px;
  line-height:1.1;
  margin:6px 0 4px;
  font-weight:400
}

.measure span{
  font-size:14px;
  color:var(--muted)
}

.measure b.pos{
  color:var(--green)
}

.measure b.neg{
  color:var(--red)
}

.fixline{
  display:flex;
  justify-content:space-between;
  gap:18px;
  margin-top:12px;
  padding:16px 20px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--soft-green);
  font-family:Arial,Helvetica,sans-serif;
  font-size:14px
}

.fixline div{
  display:flex;
  gap:9px;
  align-items:center
}

.fixline span{
  color:var(--muted)
}

.fixline b{
  font-size:18px
}

.fixline b.pos{
  color:var(--green)
}

.actions{
  display:grid;
  grid-template-columns:1fr 1.25fr;
  gap:12px;
  margin-top:16px
}

.actions button{
  border-radius:999px;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  font-family:Arial,Helvetica,sans-serif;
  font-weight:750;
  font-size:15px
}

.actions .secondary{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink)
}

.actions .primary{
  border:1px solid var(--green);
  background:var(--green);
  color:white;
  box-shadow:0 8px 20px rgba(90,138,90,.2)
}

.actions button:disabled{
  opacity:.35;
  cursor:not-allowed;
  box-shadow:none
}

.text-btn{
  grid-column:1/-1;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:5px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px
}

.text-btn:disabled{
  opacity:.35
}

.notice{
  color:#8a3c34;
  background:#f9e8e4;
  border-radius:10px;
  padding:11px 14px;
  font-size:15px;
  text-align:center
}

.filename{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  display:flex;
  justify-content:center;
  gap:7px;
  align-items:center
}

.division{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  padding:22px 10px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  margin:26px 0 0;
  font-size:18px;
  color:var(--muted)
}

.division b{
  color:var(--gold)
}

.division .green{
  color:var(--green)
}

.division.small{
  border-top:0;
  margin-top:0;
  color:var(--ink)
}

.essence-section{
  padding:36px 4px 10px
}

.section-label{
  font-family:Arial,Helvetica,sans-serif;
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:800;
  margin:0
}

h2{
  font-size:32px;
  line-height:1.15;
  margin:9px 0;
  font-weight:400
}

.section-copy{
  color:var(--muted);
  max-width:720px;
  margin:0
}

.essences{
  list-style:none;
  padding:0;
  margin:24px 0 0
}

.essences li{
  display:grid;
  grid-template-columns:54px 1fr;
  gap:14px;
  padding:20px 0;
  border-top:1px solid var(--line)
}

.essences .num{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--gold);
  font-size:13px;
  letter-spacing:.1em;
  padding-top:4px
}

.essences strong{
  font-size:19px;
  line-height:1.4
}

.essences p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:16px
}

.trace-section{
  margin:30px 4px 0;
  padding:28px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:22px
}

.trace{
  list-style:none;
  margin:18px 0 0;
  padding:0;
  max-height:190px;
  overflow:auto
}

.trace li{
  display:grid;
  grid-template-columns:78px 1fr;
  gap:14px;
  padding:9px 0;
  border-top:1px solid var(--line);
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
  color:var(--muted)
}

.trace time{
  font-variant-numeric:tabular-nums
}

.trace span{
  color:var(--ink)
}

footer{
  max-width:1020px;
  margin:32px auto 0;
  padding-top:18px;
  border-top:1px solid var(--line);
  text-align:center;
  color:var(--muted);
  font-family:Arial,Helvetica,sans-serif;
  font-size:12px;
  letter-spacing:.08em
}

@media(max-width:700px){
  .shell{
    padding-left:14px;
    padding-right:14px
  }

  .topbar{
    flex-direction:column;
    align-items:stretch;
    padding-top:18px
  }

  .formula-card{
    min-width:0
  }

  .intro{
    grid-template-columns:1fr;
    gap:20px
  }

  .images{
    grid-template-columns:1fr
  }

  .photo-area{
    min-height:260px
  }

  .measure{
    grid-template-columns:1fr
  }

  .measure>div{
    padding:16px 18px
  }

  .measure b{
    font-size:32px
  }

  .fixline{
    flex-wrap:wrap;
    justify-content:flex-start
  }

  .actions{
    grid-template-columns:1fr
  }

  .essences li{
    grid-template-columns:36px 1fr
  }

  .trace li{
    grid-template-columns:1fr;
    gap:2px
  }

  .division{
    gap:7px
  }

  .division.small{
    padding-top:18px
  }
}

@media(max-width:390px){
  .topbar h1{
    font-size:32px
  }

  .division{
    font-size:15px
  }

  .mode-wrap{
    padding:14px
  }
}
