:root{
  --bg:#0d0f0c;
  --panel:#131610;
  --line:#26281f;
  --ink:#f2efe8;
  --muted:#9a958a;
  --gold:#e8c87a
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#0d0f0c;
    --panel:#131610;
    --line:#26281f;
    --ink:#f2efe8;
    --muted:#9a958a;
    --gold:#e8c87a
  }
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Georgia,serif
}

.shell{
  max-width:920px;
  margin:0 auto;
  padding:var(--safe-area-inset-top,0px) 18px 24px
}

header{
  text-align:center;
  padding:28px 0 21px;
  border-bottom:1px solid var(--line);
  margin-bottom:21px
}

.eyebrow{
  font:10px/1 ui-monospace,monospace;
  letter-spacing:.25em;
  color:var(--gold);
  text-transform:uppercase;
  margin:0
}

h1{
  font-weight:400;
  font-size:34px;
  margin:13px 0
}

h1 b{
  color:var(--gold)
}

.rule{
  color:var(--muted);
  font-style:italic;
  font-size:13px;
  max-width:620px;
  margin:0 auto
}

h2{
  font:11px/1 ui-monospace,monospace;
  letter-spacing:.2em;
  color:var(--gold);
  text-transform:uppercase;
  margin:0 0 13px;
  font-weight:400
}

section{
  margin-bottom:21px
}

.kaiser-panel,.konig-panel,.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:21px
}

.kaiser-panel,.konig-panel{
  border:2px solid var(--gold);
  text-align:center
}

#kaiserDial{
  display:block;
  max-width:100%;
  height:auto;
  margin:0 auto;
  background:#0a0d08;
  border-radius:50%
}

.actions{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:16px;
  flex-wrap:wrap
}

button{
  font:inherit;
  font-size:13px;
  padding:12px 21px;
  border-radius:99px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--ink);
  cursor:pointer
}

button:hover:not(:disabled){
  border-color:var(--gold)
}

button:disabled{
  opacity:.35;
  cursor:not-allowed
}

button.primary{
  border-color:var(--gold);
  background:#1e180a;
  color:var(--gold);
  font-weight:600
}

.log{
  margin-top:16px;
  font:11px/1.6 ui-monospace,monospace;
  color:var(--muted);
  text-align:left;
  max-height:110px;
  overflow-y:auto;
  background:#0a0d08;
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 13px;
  min-height:40px
}

.log div:first-child{
  color:var(--gold)
}

.konig-cells{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px
}

@media(max-width:600px){
  .konig-cells{
    grid-template-columns:1fr
  }
}

.konig-cell{
  background:#0a0d08;
  border:1px solid var(--gold);
  border-radius:9px;
  padding:13px;
  text-align:center
}

.swatch{
  height:60px;
  border-radius:6px;
  margin-bottom:10px;
  background:#1a1a1a
}

.label{
  font:10px/1 ui-monospace,monospace;
  letter-spacing:.15em;
  color:var(--muted);
  text-transform:uppercase
}

.value{
  font:11px/1.4 ui-monospace,monospace;
  color:var(--gold);
  margin-top:5px
}

.vitality{
  font:10px/1 ui-monospace,monospace;
  color:var(--muted);
  margin-top:3px
}

.note{
  font:11px/1.5 ui-monospace,monospace;
  color:var(--muted);
  margin:12px 0 0
}

.rings{
  display:block;
  max-width:100%;
  height:auto;
  margin:0 auto
}

.images{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px
}

@media(max-width:600px){
  .images{
    grid-template-columns:1fr
  }
}

.image-cell{
  background:#0a0d08;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px;
  margin:0
}

.image-cell.konig{
  border-color:var(--gold)
}

.image-cell figcaption{
  font:10px/1 ui-monospace,monospace;
  letter-spacing:.15em;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:8px
}

.image-cell.konig figcaption{
  color:var(--gold)
}

.image-cell canvas{
  width:100%;
  height:auto;
  display:block;
  border-radius:5px;
  background:#000;
  max-height:300px
}

.controls{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:12px;
  align-items:center;
  margin-top:16px
}

.controls label{
  font:11px/1 ui-monospace,monospace;
  letter-spacing:.1em;
  color:var(--muted)
}

.controls input{
  width:100%;
  accent-color:var(--gold)
}

.controls output{
  font:13px/1 ui-monospace,monospace;
  color:var(--gold);
  min-width:3ch;
  text-align:right
}

.disks{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:14px
}

@media(max-width:600px){
  .disks{
    grid-template-columns:1fr
  }
}

.disk{
  background:#0a0d08;
  border:1px solid var(--line);
  border-radius:9px;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:.2s
}

.disk.flash{
  border-color:#7ec98a;
  background:#122314;
  box-shadow:0 0 0 2px rgba(126,201,138,.25)
}

.disk span,.disk strong{
  font:11px/1 ui-monospace,monospace
}

.disk i{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#7ec98a;
  display:block
}

.raid-row{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  font:11px/1 ui-monospace,monospace;
  color:var(--muted)
}

.bar{
  flex:1;
  min-width:120px;
  height:10px;
  background:#0a0d08;
  border:1px solid var(--line);
  border-radius:99px;
  overflow:hidden
}

.bar div{
  height:100%;
  background:var(--gold);
  transition:width .5s
}

.sli{
  color:var(--gold)
}

.run8{
  border-color:var(--gold);
  color:var(--gold);
  background:#1e180a
}

.rom-row{
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:18px
}

@media(max-width:650px){
  .rom-row{
    grid-template-columns:1fr
  }
}

.rom-row>div>span{
  font:10px/1 ui-monospace,monospace;
  letter-spacing:.12em;
  color:var(--muted);
  text-transform:uppercase
}

.rom-values{
  display:flex;
  gap:8px;
  margin-top:10px
}

.rom-values b{
  border:1px solid var(--gold);
  color:var(--gold);
  padding:10px 13px;
  border-radius:8px;
  font:13px/1 ui-monospace,monospace
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px
}

.chip{
  padding:9px 13px
}

.chip.active{
  background:#e8c87a;
  color:#0d0f0c;
  border-color:#e8c87a;
  font-weight:700
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
  margin-bottom:14px
}

th,td{
  padding:9px 12px;
  text-align:left;
  border-bottom:1px solid var(--line)
}

th{
  font:10px/1 ui-monospace,monospace;
  letter-spacing:.15em;
  color:var(--gold);
  text-transform:uppercase
}

td.num{
  font-family:ui-monospace,monospace;
  text-align:right
}

td.king{
  color:var(--gold);
  font-weight:700
}

td.muted{
  color:var(--muted);
  text-align:center
}

footer{
  text-align:center;
  font:10px/1 ui-monospace,monospace;
  letter-spacing:.15em;
  color:var(--muted);
  padding-top:21px;
  border-top:1px solid var(--line)
}
