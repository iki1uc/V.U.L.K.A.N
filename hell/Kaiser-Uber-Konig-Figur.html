:root{
  --bg:#0d0f0c;
  --panel:#131610;
  --line:#26281f;
  --ink:#f2efe8;
  --muted:#9a958a;
  --gold:#e8c87a;
  --green:#7ec98a;
  --red:#ff8a8a
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0f0c;
    --panel:#131610;
    --line:#2b2e24;
    --ink:#f2efe8;
    --muted:#a9a49a;
    --gold:#e8c87a
  }
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Georgia,'Times New Roman',serif
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top,0px) 18px 28px;
  max-width:1020px;
  margin:0 auto
}

.top{
  text-align:center;
  padding:34px 0 21px;
  border-bottom:1px solid var(--line)
}

.eyebrow{
  font:10px/1 ui-monospace,monospace;
  letter-spacing:.25em;
  color:var(--gold);
  text-transform:uppercase;
  margin:0
}

h1{
  font-weight:400;
  font-size:34px;
  margin:13px 0
}

h1 b{
  color:var(--gold)
}

.rule{
  color:var(--muted);
  font-style:italic;
  font-size:13px;
  max-width:680px;
  margin:0 auto;
  line-height:1.6
}

.chain{
  display:flex;
  gap:8px;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  margin-top:18px;
  font:11px/1 ui-monospace,monospace;
  color:var(--gold)
}

.chain span{
  border:1px solid var(--line);
  padding:7px 9px;
  border-radius:99px
}

.chain i{
  font-style:normal;
  color:var(--muted)
}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:21px;
  margin-top:21px
}

.kaiser-panel,.konig-panel{
  border:2px solid var(--gold)
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:13px;
  flex-wrap:wrap
}

.section-head h2{
  font:11px/1 ui-monospace,monospace;
  letter-spacing:.2em;
  color:var(--gold);
  text-transform:uppercase;
  margin:0;
  font-weight:400
}

.section-head>span{
  font:10px/1 ui-monospace,monospace;
  color:var(--muted)
}

.live{
  color:var(--gold)!important
}

.kaiser-grid{
  display:grid;
  grid-template-columns:minmax(0,430px) 1fr;
  gap:21px;
  margin-top:16px
}

.kaiser-grid canvas,.rings-grid canvas{
  width:100%;
  height:auto;
  display:block;
  background:#0a0d08;
  border-radius:50%
}

.rings-grid canvas{
  border-radius:10px
}

.kaiser-side p{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin:0 0 10px
}

.kaiser-side strong{
  color:var(--ink)
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:14px 0
}

button{
  border:1px solid var(--line);
  background:#0a0d08;
  color:var(--ink);
  padding:11px 16px;
  border-radius:99px
}

button:hover{
  border-color:var(--gold)
}

button:disabled{
  opacity:.35;
  cursor:not-allowed
}

button.primary{
  border-color:var(--gold);
  background:#1e180a;
  color:var(--gold);
  font-weight:700
}

.range{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
  margin:16px 0 12px
}

.range span{
  font:10px/1 ui-monospace,monospace;
  letter-spacing:.12em;
  color:var(--muted);
  text-transform:uppercase
}

.range input{
  grid-column:1/3;
  width:100%;
  accent-color:var(--gold)
}

.range output{
  color:var(--gold);
  font-family:ui-monospace,monospace
}

.log{
  background:#0a0d08;
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 13px;
  min-height:92px;
  font:11px/1.6 ui-monospace,monospace;
  color:var(--muted);
  overflow:hidden
}

.log div:first-child{
  color:var(--gold)
}

.konig-cells{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px;
  margin-top:16px
}

.konig-cell{
  background:#0a0d08;
  border:1px solid var(--gold);
  border-radius:9px;
  padding:13px;
  text-align:center
}

.swatch{
  height:60px;
  border-radius:6px;
  margin-bottom:10px;
  display:block
}

.konig-cell .label{
  font:10px/1 ui-monospace,monospace;
  letter-spacing:.15em;
  color:var(--muted)
}

.konig-cell .value{
  font:11px/1.4 ui-monospace,monospace;
  color:var(--gold);
  margin-top:5px
}

.konig-cell .vitality{
  font:10px/1.3 ui-monospace,monospace;
  color:var(--muted);
  margin-top:3px
}

.center-note{
  text-align:center;
  color:var(--muted);
  font-style:italic;
  font-size:12px;
  margin:14px 0 0
}

.rings-grid{
  display:grid;
  grid-template-columns:minmax(0,390px) 1fr;
  gap:21px;
  margin-top:16px;
  align-items:center
}

.ring-list{
  display:grid;
  gap:8px
}

.ring-list div{
  display:flex;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid var(--line);
  padding:8px 0;
  font-size:13px
}

.ring-list b{
  color:var(--gold);
  font-family:ui-monospace,monospace
}

.ring-list span{
  color:var(--muted);
  text-align:right
}

.raid-intro{
  color:var(--muted);
  font-size:13px;
  line-height:1.6
}

.disks{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin-top:14px
}

.disk{
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  text-align:left;
  background:#0a0d08;
  min-height:148px;
  display:flex;
  flex-direction:column;
  gap:5px
}

.disk.failed{
  border-color:#ff8a8a;
  background:#241414
}

.disk.rebuilding{
  border-color:var(--gold);
  background:#1e180a
}

.disk-top{
  display:flex;
  align-items:center;
  gap:8px
}

.disk-dot{
  width:24px;
  height:24px;
  border-radius:50%;
  border:1px solid var(--line);
  display:inline-block
}

.disk-top strong{
  font-family:ui-monospace,monospace
}

.disk-top em{
  margin-left:auto;
  font-style:normal
}

.figur{
  font-weight:700;
  letter-spacing:.08em
}

.raid-role{
  font:10px/1 ui-monospace,monospace;
  color:var(--gold)
}

.disk-note{
  font-size:11px;
  line-height:1.4;
  color:var(--muted)
}

.parity{
  font:10px/1.3 ui-monospace,monospace;
  color:var(--muted)
}

.raid-detail{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  border-top:1px solid var(--line);
  margin-top:14px;
  padding-top:14px
}

.raid-detail span{
  color:var(--muted);
  font-size:12px
}

.raid-detail button{
  margin-left:auto
}

.images{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
  margin-top:16px
}

.images figure{
  margin:0;
  background:#0a0d08;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px
}

.images figure.konig-img{
  border-color:var(--gold)
}

.images figcaption{
  font:10px/1 ui-monospace,monospace;
  letter-spacing:.15em;
  color:var(--muted);
  margin-bottom:8px
}

.images .konig-img figcaption{
  color:var(--gold)
}

.images canvas{
  width:100%;
  height:auto;
  display:block;
  border-radius:5px;
  background:#000;
  max-height:320px
}

.pipeline{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  margin-top:14px;
  font:10px/1 ui-monospace,monospace;
  color:var(--muted)
}

.pipeline span{
  color:var(--gold);
  border:1px solid var(--line);
  padding:5px 7px;
  border-radius:99px
}

.pipeline i{
  font-style:normal
}

footer{
  text-align:center;
  font:10px/1 ui-monospace,monospace;
  letter-spacing:.15em;
  color:var(--muted);
  padding:21px 0 8px;
  border-top:1px solid var(--line);
  margin-top:21px
}

@media(max-width:700px){
  .kaiser-grid,.rings-grid,.images,.konig-cells,.disks{
    grid-template-columns:1fr
  }

  .shell{
    padding-left:12px;
    padding-right:12px
  }

  .top{
    padding-top:22px
  }

  h1{
    font-size:30px
  }

  .raid-detail button{
    margin-left:0
  }

  .disks{
    grid-template-columns:1fr 1fr
  }

  .konig-cells{
    grid-template-columns:1fr
  }
}

@media(max-width:430px){
  .disks{
    grid-template-columns:1fr
  }

  .chain{
    justify-content:flex-start
  }
}
