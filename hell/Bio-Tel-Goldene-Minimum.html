        .wrap{max-width:1080px;margin:0 auto;padding:34px 21px 55px}

        figure{margin:0;border:1px solid #2b2f26;background:#11140f;padding:13px}
        figcaption{display:flex;justify-content:space-between;letter-spacing:.18em;font-size:11px;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
        figcaption span:last-child{color:#8a8f82;letter-spacing:0}
        canvas{width:100%;height:auto;display:block;background:#0a0c09;aspect-ratio:1.618/1;object-fit:cover}
        .empty{display:grid;place-items:center;aspect-ratio:1.618/1;color:#8a8f82;font-style:italic;text-align:center;padding:21px}
        .canvas-wrap{position:relative}

        .metric{border-top:1px solid var(--gold);padding:13px 0}
        .metric small{display:block;color:#8a8f82;letter-spacing:.16em;text-transform:uppercase;font-size:11px}
        .metric strong{font-size:34px;font-weight:400;color:#fff}
        .metric span{color:var(--gold)}
        .fixline{border:1px solid #3a3522;background:#17150d;padding:13px 16px;display:flex;justify-content:space-between;gap:13px;flex-wrap:wrap}
        .fixline b{color:var(--gold);letter-spacing:.14em;font-size:12px}
        .controls{margin:34px 0 21px}
        .slider-row{display:flex;align-items:center;gap:21px;flex-wrap:wrap}
        .slider-row label{letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--gold)}
        input[type=range]{flex:1;min-width:210px;accent-color:var(--gold)}
        output{font-size:42px;color:var(--gold);min-width:86px;text-align:right}

        .live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:8px;box-shadow:0 0 0 5px rgba(232,200,122,.16)}
        .actions{display:flex;gap:13px;flex-wrap:wrap;margin-top:21px}
        button{font-family:Georgia,serif;border:1px solid var(--gold);background:var(--gold);color:#0d0f0c;padding:13px 21px;cursor:pointer;font-size:15px}
        button.secondary{background:transparent;color:var(--gold)}
        button:disabled{opacity:.38;cursor:not-allowed}
        button:hover:not(:disabled){filter:brightness(1.08)}
        .status{color:#c8cbbd;font-style:italic;margin-top:13px;min-height:22px}
        .hist{border:1px solid #2b2f26;padding:21px;margin:34px 0;background:#11140f}
        .hist h2{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 5px;font-weight:400}
        .hist p{margin:0 0 13px;color:#8a8f82;font-size:13px}
        .hist canvas{aspect-ratio:auto;height:90px}
        .legend{display:flex;gap:21px;color:#c8cbbd;font-size:13px;margin-top:10px;flex-wrap:wrap}
        .dot{width:10px;height:10px;display:inline-block;margin-right:7px;vertical-align:-1px}
        .essence{display:grid;grid-template-columns:repeat(3,1fr);gap:21px;margin:34px 0}

        footer{border-top:1px solid #2b2f26;padding-top:21px;display:flex;justify-content:space-between;gap:21px;flex-wrap:wrap;color:#8a8f82;font-size:13px}
