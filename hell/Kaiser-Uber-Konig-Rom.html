:root{
  --bg:#0d0f0c;
  --panel:#131610;
  --line:#26281f;
  --ink:#f2efe8;
  --muted:#9a958a;
  --gold:#e8c87a;
  --surface:#0d0f0c;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0f0c;
    --panel:#131610;
    --line:#2b2e24;
    --ink:#f2efe8;
    --muted:#a7a294;
    --gold:#e8c87a;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0
}

body{
  background:var(--bg);
  color:var(--ink);
  font:14px/1.55 Georgia, "Times New Roman", serif
}

button,input{
  font:inherit
}

.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 18px 28px;
  max-width:900px;
  margin:0 auto
}

header{
  padding:22px 0 21px;
  border-bottom:1px solid var(--line);
  margin-bottom:21px;
  text-align:center
}

.eyebrow{
  font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.25em;
  color:var(--gold);
  text-transform:uppercase;
  margin:0
}

h1{
  font-weight:400;
  font-size:clamp(30px,7vw,38px);
  margin:13px 0 2px;
  line-height:1.05
}

h1 b{
  color:var(--gold)
}

.subtitle{
  font:11px/1 ui-monospace,monospace;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:var(--muted);
  margin:0 0 10px
}

.rule{
  color:var(--muted);
  font-style:italic;
  font-size:13px;
  max-width:640px;
  margin:0 auto
}

h2{
  font:11px/1 ui-monospace,monospace;
  letter-spacing:.2em;
  color:var(--gold);
  text-transform:uppercase;
  margin:0 0 13px;
  font-weight:400
}

section{
  margin-bottom:21px
}

.kaiser-panel,.rom-panel,.konig-panel,.rings-panel,.images-panel,.index-panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:21px
}

.kaiser-panel,.konig-panel{
  border-width:2px;
  border-color:var(--gold)
}

.kaiser-panel{
  text-align:center
}

#kaiserDial,.rings-panel canvas{
  display:block;
  max-width:100%;
  height:auto;
  margin:0 auto;
  background:#0a0d08
}

#kaiserDial{
  border-radius:50%
}

.actions{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:16px;
  flex-wrap:wrap
}

button{
  padding:12px 21px;
  border-radius:99px;
  border:1px solid var(--line);
  background:#1a1d17;
  color:var(--ink);
  cursor:pointer;
  transition:.15s
}

button:hover:not(:disabled){
  border-color:var(--gold)
}

button:disabled{
  opacity:.35;
  cursor:not-allowed
}

button.primary{
  border-color:var(--gold);
  background:#1e180a;
  color:var(--gold);
  font-weight:700
}

.result{
  font:12px/1.5 ui-monospace,monospace;
  color:var(--gold);
  margin:14px 0 0
}

.log{
  margin-top:16px;
  font:11px/1.6 ui-monospace,monospace;
  color:var(--muted);
  text-align:left;
  max-height:110px;
  overflow-y:auto;
  background:#0a0d08;
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 13px;
  min-height:40px
}

.log div{
  padding:2px 0;
  overflow-wrap:anywhere
}

.log div:first-child{
  color:var(--gold)
}

.log span{
  color:var(--muted)
}

.rom-lead{
  margin:0 0 16px;
  color:var(--ink)
}

.rom-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px
}

.rom-col{
  background:#0a0d08;
  border:1px solid var(--line);
  border-radius:10px;
  padding:16px;
  min-width:0
}

.rom-col h3{
  font:11px/1 ui-monospace,monospace;
  letter-spacing:.18em;
  margin:0 0 13px;
  color:var(--ink)
}

.rom-col h3 span{
  color:var(--muted);
  letter-spacing:.05em;
  font-weight:400
}

.rom-swatch{
  height:72px;
  border-radius:7px;
  margin-bottom:12px;
  border:1px solid var(--line)
}

.mono{
  font:11px/1.5 ui-monospace,monospace;
  color:var(--gold)
}

.muted{
  color:var(--muted);
  font-size:13px
}

.role-list{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:12px
}

.role-list span{
  border:1px solid var(--gold);
  color:var(--gold);
  border-radius:99px;
  padding:5px 10px;
  font:10px/1 ui-monospace,monospace;
  letter-spacing:.12em
}

.rom-col ul{
  padding-left:18px;
  margin:8px 0;
  color:var(--ink)
}

.rom-col li{
  margin:4px 0
}

.rom-chain{
  text-align:center;
  color:var(--muted);
  font:11px/1.6 ui-monospace,monospace;
  margin:16px 0 0
}

.rom-chain i{
  color:var(--gold);
  font-style:normal
}

.konig-cells{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px
}

.konig-cell{
  background:#0a0d08;
  border:1px solid var(--gold);
  border-radius:9px;
  padding:13px;
  text-align:center;
  min-width:0
}

.swatch{
  height:60px;
  border-radius:6px;
  margin-bottom:10px;
  background:#1a1a1a
}

.konig-cell .label{
  font:10px/1 ui-monospace,monospace;
  letter-spacing:.15em;
  color:var(--muted);
  text-transform:uppercase
}

.konig-cell .value{
  font:11px/1.4 ui-monospace,monospace;
  color:var(--gold);
  margin-top:5px;
  overflow-wrap:anywhere
}

.konig-cell .vitality{
  font:10px/1.4 ui-monospace,monospace;
  color:var(--muted);
  margin-top:3px
}

.essenz-line{
  text-align:center;
  color:var(--muted);
  margin:16px 0 0;
  font-size:13px
}

.legend{
  display:flex;
  justify-content:center;
  gap:16px;
  margin-top:13px;
  font:10px/1 ui-monospace,monospace;
  color:var(--muted);
  flex-wrap:wrap
}

.legend span{
  display:flex;
  align-items:center;
  gap:5px
}

.legend i{
  width:10px;
  height:10px;
  border-radius:2px;
  display:inline-block
}

.images{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px
}

.image-cell{
  background:#0a0d08;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px;
  min-width:0
}

.image-cell.konig{
  border-color:var(--gold)
}

.image-cell figcaption{
  font:10px/1 ui-monospace,monospace;
  letter-spacing:.15em;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:8px
}

.image-cell.konig figcaption{
  color:var(--gold)
}

.image-cell canvas{
  width:100%;
  height:auto;
  display:block;
  border-radius:5px;
  background:#000;
  max-height:300px
}

.index-note{
  color:var(--muted);
  margin:0 0 14px
}

.essenz{
  list-style:none;
  margin:0;
  padding:0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px 16px
}

.essenz li{
  font:12px/1.5 ui-monospace,monospace;
  color:var(--ink);
  border-bottom:1px solid var(--line);
  padding-bottom:6px;
  overflow-wrap:anywhere
}

.essenz span{
  color:var(--gold);
  margin-right:7px
}

footer{
  text-align:center;
  font:10px/1.6 ui-monospace,monospace;
  letter-spacing:.15em;
  color:var(--muted);
  padding-top:21px;
  border-top:1px solid var(--line);
  margin-top:21px
}

@media(max-width:640px){
  .shell{
    padding-left:14px;
    padding-right:14px
  }

  .kaiser-panel,.rom-panel,.konig-panel,.rings-panel,.images-panel,.index-panel{
    padding:16px
  }

  .rom-grid,.images,.konig-cells,.essenz{
    grid-template-columns:1fr
  }

  .essenz{
    grid-template-columns:1fr 1fr
  }

  .actions button{
    flex:1 1 40%
  }
}

@media(max-width:420px){
  .essenz{
    grid-template-columns:1fr
  }

  .actions button{
    flex:1 1 100%
  }
}
</style>
</head>
