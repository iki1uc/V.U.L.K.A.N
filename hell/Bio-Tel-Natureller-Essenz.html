:root{
  --bg:#0f1a12;
  --panel:#16241a;
  --panel2:#1b2c20;
  --gold:#ffd166;
  --green:#7fb069;
  --accent:#a8d5a2;
  --text:#e8f0e8;
  --muted:#8a9a8a;
  --line:#354a36;
  --red:#ff8f9d;
  --shadow:0 20px 55px rgba(0,0,0,.28);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1811;
    --panel:#15231a;
    --panel2:#1a2b1f;
    --text:#edf3ed;
    --muted:#93a493;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  min-width:0
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace
}

.shell{
  min-height:100vh;
  width:100%;
  padding-top:var(--safe-area-inset-top);
  overflow-x:clip;
  background:
 radial-gradient(circle at 8% 5%, rgba(255,209,102,.18), transparent 28%),
 radial-gradient(circle at 92% 18%, rgba(168,213,162,.18), transparent 30%),
 radial-gradient(circle at 50% 55%, rgba(127,176,105,.10), transparent 42%),
 linear-gradient(180deg,#182e1d 0%, #0f1a12 35%, #0b150e 100%);
}

.page{
  max-width:880px;
  margin:0 auto;
  padding:28px 16px 42px;
  position:relative;
  z-index:1
}

header{
  border-bottom:1px solid var(--line);
  padding-bottom:20px;
  margin-bottom:22px
}

.eyebrow{
  font-size:10px;
  letter-spacing:.18em;
  color:var(--muted);
  text-transform:uppercase
}

h1{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(38px,7vw,58px);
  line-height:.95;
  letter-spacing:-.04em;
  font-weight:400;
  margin:10px 0 8px
}

h1 b{
  color:var(--gold);
  font-weight:400
}

h1 span{
  font-size:.48em;
  color:var(--accent);
  letter-spacing:.02em
}

.rule{
  font-size:12px;
  letter-spacing:.03em;
  color:var(--text)
}

.rule b{
  color:var(--accent)
}

.intro{
  font-family:Georgia,serif;
  font-size:17px;
  line-height:1.55;
  color:#c8d7c8;
  margin:12px 0 0;
  font-style:italic
}

.cell{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

.photo-card{
  margin:0;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:18px;
  min-height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
  padding:38px 12px 12px
}

.photo-card:before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 15% 10%, rgba(168,213,162,.14), transparent 30%), radial-gradient(circle at 85% 90%, rgba(255,209,102,.08), transparent 25%);
  pointer-events:none
}

.tel-card{
  border-color:#5b7654;
  background:linear-gradient(145deg,#1a2d1e,#15231a)
}

figcaption{
  position:absolute;
  top:12px;
  left:14px;
  font-size:10px;
  letter-spacing:.15em;
  color:var(--muted);
  z-index:1
}

figcaption b, figcaption span{
  color:var(--gold)
}

canvas{
  max-width:100%;
  max-height:360px;
  display:block;
  border-radius:12px;
  position:relative;
  z-index:1
}

.empty{
  color:var(--muted);
  text-align:center;
  line-height:1.5;
  font-size:12px;
  position:relative;
  z-index:1;
  padding:20px
}

.big-leaf{
  font-size:42px;
  display:block;
  margin-bottom:12px
}

.photo-foot{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:10px 14px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  background:rgba(5,10,6,.78);
  font-size:10px;
  color:var(--text);
  z-index:2
}

.photo-foot em{
  font-style:normal;
  color:var(--muted);
  white-space:nowrap
}

.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:16px
}

.metric{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  min-height:104px;
  box-shadow:0 8px 24px rgba(0,0,0,.16)
}

.metric small{
  display:block;
  color:var(--muted);
  font-size:9px;
  letter-spacing:.17em
}

.metric b{
  font-size:30px;
  font-weight:400;
  display:block;
  margin:7px 0 2px
}

.metric span{
  font-size:10px;
  color:var(--muted)
}

.tel-metric{
  border-color:#597a50;
  background:linear-gradient(145deg,#1d3222,#172718)
}

.delta-pos{
  color:var(--accent)
}

.delta-neg{
  color:var(--red)
}

.fixline{
  margin-top:10px;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#101f14;
  font-size:11px;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px
}

.fixline b{
  color:var(--text);
  font-weight:400
}

.ok{
  color:var(--accent)!important
}

.bad{
  color:var(--red)!important
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px
}

button{
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  padding:15px 14px;
  font:inherit;
  letter-spacing:.08em;
  font-size:11px;
  cursor:pointer;
  text-transform:uppercase;
  transition:transform .25s ease, box-shadow .25s ease, background .25s ease
}

button:hover{
  transform:translateY(-2px) scale(1.015);
  border-color:var(--gold);
  box-shadow:0 10px 24px rgba(0,0,0,.25)
}

button:disabled{
  opacity:.35;
  cursor:not-allowed;
  transform:none
}

button.go{
  border-color:#9dc98c;
  color:#fff;
  background:linear-gradient(135deg,#789f67,#496f42);
  box-shadow:0 10px 24px rgba(73,111,66,.35)
}

@keyframes breathe{
  0%,100%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.025)
  }
}

.breathe:not(:disabled){
  animation:breathe 3.6s ease-in-out infinite
}

.hint{
  text-align:center;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.04em;
  margin:12px 0 4px
}

.rings{
  margin:24px 0 10px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:18px 10px;
  display:grid;
  grid-template-columns:150px 1fr;
  gap:18px;
  align-items:center
}

.ring-visual{
  width:128px;
  height:128px;
  border-radius:50%;
  position:relative;
  display:grid;
  place-items:center;
  background:radial-gradient(circle,#243d28 0 18%,transparent 19%),radial-gradient(circle,transparent 0 33%,#365139 34% 36%,transparent 37%),radial-gradient(circle,transparent 0 52%,#47694a 53% 55%,transparent 56%),radial-gradient(circle,transparent 0 70%,#5e815e 71% 73%,transparent 74%),radial-gradient(circle,transparent 0 87%,#7fa87f 88% 90%,transparent 91%);
  border:2px solid #617f60
}

.ring-visual strong{
  font-size:28px;
  color:var(--gold);
  font-weight:400
}

.ring-copy small{
  color:var(--muted);
  letter-spacing:.18em
}

.sequence{
  font-size:15px;
  margin:9px 0
}

.sequence span{
  color:var(--text)
}

.sequence .on{
  color:var(--accent)
}

.sequence b{
  color:var(--gold);
  font-weight:400
}

.sequence em{
  font-style:normal;
  color:var(--muted);
  margin:0 6px
}

.ring-copy p{
  font-family:Georgia,serif;
  color:#cbdccb;
  margin:0;
  font-size:14px
}

.division{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  padding:15px 4px;
  border-bottom:1px solid var(--line);
  font-size:12px;
  letter-spacing:.18em;
  color:var(--muted);
  flex-wrap:wrap
}

.division b{
  color:var(--gold);
  font-weight:400
}

.division em{
  font-style:normal
}

.division-note{
  font-family:Georgia,serif;
  letter-spacing:0;
  text-transform:none;
  font-size:13px;
  color:#b9cbb9
}

h2{
  font-family:Georgia,serif;
  font-size:22px;
  font-weight:400;
  letter-spacing:-.01em;
  margin:28px 0 10px;
  color:#f2f5f0
}

.essences{
  list-style:none;
  padding:0;
  margin:0
}

.essences li{
  padding:16px 0;
  border-bottom:1px solid var(--line);
  display:grid;
  grid-template-columns:38px 1fr;
  gap:12px;
  align-items:start
}

.num{
  color:var(--gold);
  font-size:11px;
  padding-top:4px
}

.ess{
  font-family:Georgia,serif;
  font-size:18px;
  line-height:1.35
}

.grund{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
  line-height:1.6
}

.trace{
  list-style:none;
  padding:0;
  margin:0;
  max-height:200px;
  overflow:auto;
  border-top:1px solid var(--line)
}

.trace li{
  padding:8px 0;
  border-bottom:1px solid var(--line);
  color:var(--muted);
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.trace li span{
  color:#6d806d
}

.trace li b{
  color:var(--text);
  font-weight:400
}

footer{
  margin-top:26px;
  padding-top:16px;
  border-top:1px solid var(--line);
  font-size:10px;
  color:var(--muted);
  letter-spacing:.12em;
  text-align:center
}

.falling{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0
}

.falling span{
  position:absolute;
  top:-30px;
  opacity:.45;
  font-size:20px;
  animation:fall 11s linear infinite
}

.falling span:nth-child(1){
  left:12%
}

.falling span:nth-child(2){
  left:58%;
  animation-delay:3s
}

.falling span:nth-child(3){
  left:85%;
  animation-delay:6s
}

@keyframes fall{
  to{
    transform:translate(35px,110vh) rotate(260deg)
  }
}

@media(max-width:600px){
  .cell,.actions{
    grid-template-columns:1fr
  }

  .metrics{
    grid-template-columns:1fr 1fr
  }

  .metric:last-child{
    grid-column:1/-1
  }

  .rings{
    grid-template-columns:1fr;
    text-align:center
  }

  .ring-visual{
    margin:0 auto
  }

  .desktop-only{
    display:none
  }

  .photo-card{
    min-height:230px
  }

  .fixline{
    flex-direction:column
  }

  .photo-foot{
    flex-direction:column;
    gap:2px
  }

  .photo-foot em{
    text-align:left
  }
}

@media(max-width:390px){
  .page{
    padding-left:12px;
    padding-right:12px
  }

  .sequence{
    font-size:13px
  }

  .ess{
    font-size:17px
  }
}

@media (prefers-reduced-motion: reduce){
  .breathe,.falling span{
    animation:none
  }
}
