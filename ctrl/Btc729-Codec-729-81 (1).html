:root{
  --gold:#e8c87a;
  --bg:#0d0f0c;
  --panel:#14170f;
  --ink:#f2ead6;
  --muted:#a9a48d;
  --line:#2b2e24;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --gold:#e8c87a;
    --bg:#0d0f0c;
    --panel:#14170f;
    --ink:#f2ead6;
    --muted:#a9a48d;
    --line:#2b2e24;
  }
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Georgia, "Times New Roman", serif;
}

main{
  background:var(--bg);
  padding-top:var(--safe-area-inset-top);
}

h2{
  font-size:13px;
  letter-spacing:.14em;
  font-weight:700;
}

h3{
  font-size:12px;
  letter-spacing:.08em;
  font-weight:700;
}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  padding:21px;
}

.canvas-wrap{
  background:#0a0c09;
  border:1px solid var(--line);
  padding:8px;
}

.pill{
  background:var(--gold);
  color:#0d0f0c;
  padding:4px 8px;
  font-weight:700;
  border-radius:2px;
}

.chip{
  border:1px solid var(--line);
  padding:6px 9px;
  border-radius:999px;
  background:#171a13;
}

.btn-primary{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:var(--gold);
  color:#0d0f0c;
  font-weight:700;
  padding:13px;
  border-radius:3px;
  border:0;
  cursor:pointer;
}

.btn-ghost{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:transparent;
  color:var(--ink);
  border:1px solid var(--line);
  padding:12px;
  border-radius:3px;
  cursor:pointer;
  font-family:Georgia, serif;
}

.btn-ghost:hover, .btn-primary:hover{
  filter:brightness(1.08);
}

.seg{
  border:1px solid var(--line);
  padding:7px 10px;
  font-size:12px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  border-radius:2px;
}

.seg-active{
  background:var(--gold);
  color:#0d0f0c;
  border-color:var(--gold);
  font-weight:700;
}

input[type="range"]{
  cursor:pointer;
}

@media (min-width: 640px) {
  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-\[34px\] {
    padding-top: 34px;
  }

  .sm\:text-\[48px\] {
    font-size: 48px;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
