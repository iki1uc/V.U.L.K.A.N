:root{
  --bg:#fafaf8;
  --surface:#fff;
  --ink:#1a1a1a;
  --muted:#696761;
  --line:#e5e1d8;
  --orange:#e85d1a;
  --gold:#b8963a;
  --green:#216e4a;
  --red:#9b3425;
  --safe-area-inset-top:0px
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#171714;
    --surface:#232320;
    --ink:#f5f1e8;
    --muted:#b9b6ad;
    --line:#3b3a35;
    --orange:#ff7040;
    --gold:#d5b654;
    --green:#72c89a;
    --red:#ff8676
  }
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg)
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
  font-size:18px;
  line-height:1.65
}

button,input{
  font:inherit
}

.shell{
  min-height:100vh;
  background:var(--bg);
  padding:var(--safe-area-inset-top) 0 0
}

.topbar{
  max-width:1120px;
  margin:auto;
  padding:24px 24px 18px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:20px;
  border-bottom:2px solid var(--ink)
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:18px;
  letter-spacing:.04em
}

.brand span:last-child{
  font-size:13px;
  letter-spacing:.14em;
  color:var(--muted)
}

.volcano{
  color:var(--orange);
  font-size:28px;
  line-height:1
}

.topbar>p{
  font-family:Arial,Helvetica,sans-serif;
  font-size:15px;
  color:var(--muted);
  margin:0
}

main{
  max-width:1120px;
  margin:auto;
  padding:40px 24px 70px
}

.intro{
  max-width:860px
}

.eyebrow{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--orange);
  font-size:13px;
  font-weight:800;
  letter-spacing:.18em;
  text-transform:uppercase
}

.intro h1{
  font-size:clamp(42px,7vw,76px);
  line-height:.98;
  letter-spacing:-.04em;
  margin:14px 0 28px;
  font-weight:500
}

.intro h1 span{
  color:var(--muted);
  font-weight:400
}

.honest{
  border-left:4px solid var(--gold);
  padding:8px 0 8px 20px;
  margin:28px 0
}

.honest strong{
  font-family:Arial,Helvetica,sans-serif;
  font-size:14px;
  letter-spacing:.12em;
  text-transform:uppercase
}

.honest p{
  font-size:24px;
  line-height:1.35;
  margin:7px 0 0
}

.metaphor{
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  gap:10px;
  align-items:center;
  color:var(--muted);
  font-size:16px
}

.metaphor svg{
  color:var(--orange);
  flex:none
}

.steps{
  display:grid;
  grid-template-columns:1fr 1fr 1.35fr;
  gap:18px;
  margin-top:54px
}

.step{
  background:var(--surface);
  border:1px solid var(--line);
  padding:26px;
  box-shadow:0 8px 30px rgba(0,0,0,.035)
}

.stepHead{
  display:flex;
  align-items:center;
  gap:12px
}

.stepHead span{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--ink);
  color:var(--bg);
  display:grid;
  place-items:center;
  font-family:Arial,Helvetica,sans-serif;
  font-weight:800
}

.stepHead h2{
  font-size:21px;
  letter-spacing:.04em;
  margin:0
}

.step>p{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--muted);
  font-size:16px;
  line-height:1.55
}

.secondary,.primary{
  width:100%;
  border:0;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-height:58px;
  padding:14px;
  border-radius:2px;
  font-family:Arial,Helvetica,sans-serif;
  font-weight:800
}

.secondary{
  background:var(--ink);
  color:var(--bg)
}

.primary{
  background:var(--orange);
  color:#fff;
  font-size:20px;
  letter-spacing:.03em;
  box-shadow:0 7px 0 #9b3310
}

.primary:active{
  transform:translateY(4px);
  box-shadow:0 3px 0 #9b3310
}

.primary:disabled{
  opacity:.45;
  cursor:not-allowed;
  box-shadow:none
}

.file{
  font-family:Arial,Helvetica,sans-serif;
  font-size:14px;
  display:flex;
  gap:7px;
  align-items:center;
  overflow-wrap:anywhere
}

.file svg{
  color:var(--green);
  flex:none
}

.thumb{
  margin-top:18px
}

.thumb img,.frame img{
  width:100%;
  display:block;
  -o-object-fit:cover;
     object-fit:cover;
  aspect-ratio:4/3;
  background:#ddd
}

.thumb span{
  font-family:Arial,Helvetica,sans-serif;
  font-size:12px;
  letter-spacing:.1em;
  color:var(--muted)
}

.volcano-stage{
  height:96px;
  position:relative;
  overflow:hidden;
  text-align:center
}

.cone{
  font-size:68px;
  color:var(--ink);
  line-height:1
}

.lava{
  height:5px;
  background:var(--orange);
  width:90px;
  margin:-8px auto
}

.particles{
  position:absolute;
  inset:0;
  pointer-events:none
}

.particles i{
  position:absolute;
  bottom:20px;
  left:50%;
  width:9px;
  height:9px;
  background:var(--orange);
  border-radius:50%;
  opacity:0
}

.burst .particles i{
  animation:burst .6s ease-out forwards
}

.burst .particles i:nth-child(2){
  animation-delay:.04s;
  background:var(--gold)
}

.burst .particles i:nth-child(3){
  animation-delay:.08s
}

.burst .particles i:nth-child(4){
  animation-delay:.02s;
  background:#ffb22f
}

.burst .particles i:nth-child(5){
  animation-delay:.1s;
  background:var(--gold)
}

.burst .particles i:nth-child(6){
  animation-delay:.06s
}

@keyframes burst{
  0%{
    opacity:1;
    transform:translate(0,0)
  }

  100%{
    opacity:0;
    transform:translate(var(--x,20px),-82px)
  }
}

.burst .particles i:nth-child(1){
  --x:-58px
}

.burst .particles i:nth-child(2){
  --x:-28px
}

.burst .particles i:nth-child(3){
  --x:12px
}

.burst .particles i:nth-child(4){
  --x:48px
}

.burst .particles i:nth-child(5){
  --x:-8px
}

.burst .particles i:nth-child(6){
  --x:68px
}

.small{
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
  text-align:center
}

.tuning{
  border-top:1px solid var(--line);
  padding-top:18px
}

.tuning label{
  display:block;
  margin:14px 0
}

.tuning label>span{
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
  letter-spacing:.1em;
  display:flex;
  justify-content:space-between
}

.tuning input{
  width:100%;
  accent-color:var(--orange);
  height:28px
}

.tuning p{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--muted);
  font-size:13px
}

.compare{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.compare figure{
  margin:0
}

.frame{
  border:1px solid var(--line);
  min-height:150px
}

.frame.adapted{
  border-color:var(--gold)
}

.empty{
  aspect-ratio:4/3;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  color:var(--muted);
  text-align:center;
  padding:12px
}

.empty span{
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px
}

.compare figcaption{
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
  color:var(--muted);
  margin-top:6px
}

.scores{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  margin:18px 0
}

.scores>div{
  padding:13px 7px
}

.scores small{
  display:block;
  font-family:Arial,Helvetica,sans-serif;
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--muted)
}

.scores strong{
  font-size:26px
}

.delta{
  border-left:1px solid var(--line);
  padding-left:14px!important
}

.verdict{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  font-family:Arial,Helvetica,sans-serif;
  font-size:15px
}

.verdict.yes{
  color:var(--green)
}

.verdict.no{
  color:var(--red)
}

.verdict span{
  color:var(--muted)
}

.textBtn{
  border:0;
  background:transparent;
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:7px;
  padding:12px 0;
  cursor:pointer
}

.log{
  border-top:2px solid var(--ink);
  margin-top:52px;
  padding-top:20px
}

.log h2{
  font-size:24px;
  margin:0 0 16px
}

.log ol{
  list-style:none;
  padding:0;
  margin:0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px
}

.log li{
  border-top:1px solid var(--line);
  padding-top:12px
}

.log b{
  display:block;
  font-family:Arial,Helvetica,sans-serif;
  font-size:12px;
  letter-spacing:.14em;
  color:var(--orange)
}

.log span{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--muted);
  font-size:15px
}

.notice{
  font-family:Arial,Helvetica,sans-serif;
  font-size:15px;
  background:#fff4e6;
  color:#62310c;
  padding:12px 14px;
  border-left:3px solid var(--orange)
}

footer{
  max-width:1120px;
  margin:auto;
  border-top:2px solid var(--ink);
  padding:24px;
  display:flex;
  justify-content:space-between;
  gap:16px;
  font-family:Arial,Helvetica,sans-serif
}

footer span{
  color:var(--muted)
}

.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0)

@media(max-width:850px){
  .topbar{
    align-items:flex-start;
    flex-direction:column;
    gap:4px
  }

  .steps{
    grid-template-columns:1fr
  }

  .log ol{
    grid-template-columns:1fr
  }

  .intro h1{
    font-size:44px
  }

  footer{
    flex-direction:column
  }
}

@media(max-width:480px){
  main,.topbar,footer{
    padding-left:16px;
    padding-right:16px
  }

  .step{
    padding:20px 16px
  }

  .compare{
    grid-template-columns:1fr
  }

  .scores strong{
    font-size:22px
  }

  .brand{
    font-size:16px
  }

  .topbar{
    padding-top:18px
  }
}

@media(prefers-color-scheme:dark){
  .notice{
    background:#382514;
    color:#ffd7bb
  }

  .frame img{
    background:#333
  }
}

/* CTRL.LER / SLI / CYC */

.statusbar{
  max-width:1120px;
  margin:0 auto;
  padding:14px 24px;
  display:flex;
  flex-wrap:wrap;
  gap:10px 22px;
  border-bottom:1px solid var(--line);
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.02em
}

.statusbar span{
  display:flex;
  align-items:center;
  gap:7px
}

.statusbar svg{
  color:var(--green);
  flex:none
}

.statusCodec{
  color:var(--orange)
}

.statusCodec svg{
  color:var(--orange)
}

.layers{
  display:grid;
  grid-template-columns:1fr 1fr 1.15fr;
  gap:18px;
  margin-top:52px
}

.layer{
  display:flex;
  flex-direction:column
}

.layer>p{
  font-size:16px
}

.layer strong{
  color:var(--ink)
}

.checklist{
  list-style:none;
  padding:0;
  margin:6px 0 18px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:15px
}

.checklist li{
  display:flex;
  gap:9px;
  padding:7px 0;
  border-bottom:1px solid var(--line)
}

.checklist li span{
  color:var(--green);
  font-weight:800
}

.layerButtons{
  display:grid;
  gap:10px
}

.goldBtn{
  background:var(--gold)!important;
  color:#fff!important
}

.layerNote{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
  overflow-wrap:anywhere
}

.learned{
  font-family:Arial,Helvetica,sans-serif;
  font-size:14px;
  display:flex;
  gap:8px;
  align-items:center;
  color:var(--green);
  margin:12px 0 0
}

.learned svg{
  flex:none
}

.sliChain{
  list-style:none;
  padding:0;
  margin:6px 0 16px;
  font-family:Arial,Helvetica,sans-serif
}

.sliChain li{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:11px 12px;
  border:1px solid var(--line);
  margin-bottom:8px;
  border-radius:2px
}

.sliChain li.active{
  border-color:var(--orange);
  background:#fff4e6
}

.sliChain li.reached{
  border-color:var(--green)
}

.sliChain b{
  letter-spacing:.08em
}

.sliChain span{
  color:var(--muted);
  font-size:13px
}

.cycPhase{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
  border:1px solid var(--line);
  padding:11px 12px
}

.cycPhase strong{
  font-size:22px;
  color:var(--orange);
  letter-spacing:.08em
}

.cycCurrent{
  margin:16px 0 6px
}

.cycCurrent small{
  display:block;
  font-family:Arial,Helvetica,sans-serif;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted)
}

.cycCurrent strong{
  display:block;
  font-size:21px;
  overflow-wrap:anywhere;
  line-height:1.25
}

.cycCurrent span{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--muted);
  font-size:13px
}

.cycCount{
  display:flex;
  align-items:baseline;
  gap:10px;
  font-family:Arial,Helvetica,sans-serif;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:10px 0;
  margin:10px 0
}

.cycCount strong{
  font-size:30px;
  color:var(--orange)
}

.cycCount span{
  color:var(--muted);
  font-size:13px
}

.nextVol{
  border:1px solid var(--gold);
  padding:14px;
  margin:4px 0 16px
}

.nextVol>span{
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
  font-weight:800;
  letter-spacing:.04em
}

.volChoices{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:12px 0
}

.volBtn{
  border:1px solid var(--ink);
  background:transparent;
  color:var(--ink);
  padding:10px 14px;
  cursor:pointer;
  font-family:Arial,Helvetica,sans-serif;
  font-weight:800
}

.volBtn.selected{
  background:var(--ink);
  color:var(--bg)
}

.nextVol p{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
  margin:0;
  overflow-wrap:anywhere
}

.cycList{
  list-style:none;
  padding:0;
  margin:0 0 18px;
  font-family:Arial,Helvetica,sans-serif
}

.cycList li{
  display:flex;
  align-items:center;
  gap:9px;
  padding:7px 8px;
  border-bottom:1px solid var(--line);
  font-size:14px
}

.cycList li.active{
  background:#fff4e6;
  border-color:var(--orange)
}

.cycList li span{
  width:24px;
  height:24px;
  flex:none;
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  font-size:12px
}

.cycList small{
  color:var(--muted);
  font-size:12px;
  overflow-wrap:anywhere
}

@media(max-width:850px){
  .layers{
    grid-template-columns:1fr
  }

  .statusbar{
    padding-left:16px;
    padding-right:16px
  }
}

@media(prefers-color-scheme:dark){
  .sliChain li.active,.cycList li.active{
    background:#382514
  }

  .volBtn.selected{
    background:var(--ink)
  }
}
