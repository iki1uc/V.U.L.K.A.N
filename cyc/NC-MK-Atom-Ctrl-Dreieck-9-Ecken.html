<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NC · MK.atom.ctrl · Dreieck zu 9 Ecken</title>
<style>
:root{--bg:#0b0b0e;--pn:#121217;--ln:#25252e;--tx:#e8e8ee;--mu:#8a8a95;--cy:#00ffd0;--ye:#ffcc33;--pk:#ff2d95}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:14px;letter-spacing:.14em;margin:0}
.sub{color:var(--mu);font-size:11px;margin-top:2px}
.grid{display:grid;grid-template-columns:300px 1fr;gap:12px;margin-top:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.box{background:var(--pn);border:1px solid var(--ln);padding:12px}
svg{width:100%;height:auto;display:block}
.v{fill:#0b0b0e;stroke:var(--ln);stroke-width:2}
.v.on{fill:var(--cy);stroke:var(--cy)}
.v.cur{fill:var(--ye);stroke:var(--ye)}
.ed{stroke:var(--ln);stroke-width:1;fill:none}
.tri{stroke:var(--pk);stroke-width:1.5;fill:rgba(255,45,149,.07);opacity:.35;transition:.3s}
.tri.on{opacity:1}
.lb{fill:var(--mu);font-size:9px;text-anchor:middle}
.cmds{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button{font:inherit;font-size:11px;background:#0d0d10;color:var(--tx);border:1px solid var(--ln);padding:6px 8px;cursor:pointer}
button:hover{border-color:var(--cy)}
button.next{border-color:var(--ye);color:var(--ye)}
button.done{color:var(--cy)}
button.atk{background:var(--pk);border-color:var(--pk);color:#000;font-weight:700}
button.ex{border-color:var(--cy);color:var(--cy)}
.row{display:flex;gap:6px}
input{flex:1;font:inherit;background:#08080a;color:var(--cy);border:1px solid var(--ln);padding:7px 9px;outline:none}
input:focus{border-color:var(--cy)}
#log{background:#08080a;border:1px solid var(--ln);height:300px;overflow:auto;padding:8px;margin-top:10px;white-space:pre-wrap;word-break:break-word}
.l-ok{color:var(--cy)}.l-er{color:var(--pk)}.l-in{color:var(--mu)}.l-hi{color:var(--ye)}
.st{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mu);margin-top:8px}
.st b{color:var(--tx)}
pre#out{background:#08080a;border:1px solid var(--ln);padding:8px;max-height:220px;overflow:auto;margin:10px 0 0;font-size:11px;color:#c8c8d0;white-space:pre-wrap}
</style>
</head>
<body>
<main>
<h1>NC · MK.atom.ctrl · NOEL NOEL WRIGHT</h1>
<div class="sub">Dreieck zu 9 Ecken · reine NC-Commands · f(x)=min(x,40) · HOME 40</div>
<div class="grid">
  <div class="box">
    <svg viewBox="0 0 260 260" aria-label="Dreieck zu 9 Ecken">
      <polygon id="tri" class="tri" points=""/>
      <polygon id="nona" class="ed" points=""/>
      <g id="verts"></g>
    </svg>
    <div class="st"><span>Schritt <b id="sStep">0/9</b></span><span>Auto <b id="sAuto">aus</b></span><span>HOME <b id="sHome">–</b></span></div>
  </div>
  <div class="box">
    <div class="cmds" id="cmds"></div>
    <div class="row">
      <input id="inp" autocomplete="off" spellcheck="false" placeholder="NC.ESSENZ  (Enter)">
      <button id="go">RUN</button>
    </div>
    <div id="log"></div>
    <pre id="out" hidden></pre>
  </div>
</div>
</main>
<script>
(function(){
const HOME=40, f=x=>Math.min(x,HOME), idem=x=>f(f(x))===f(x);
const SRC=[
 {id:"wurzel.729",  n:[3,9,81,729,2187,40]},
 {id:"hoelle.24",   n:[42,40,89,38,40,76,89,44,12,40,86,40,64,41,81,40,18,72,40,86,50,33,34,9]},
 {id:"leben.1389",  n:[1389,100,16,4,28,14,61,158,20,20]},
 {id:"grab.270",    n:[100,100,6,240,100,2.96]},
 {id:"moin.wind",   n:[15,81,6.9,237,13.4,28,1,38,2268]}
];
const ORDER=[
 ["NC.ESSENZ","111","BIOS"],["NC.SCAN","222","VERBUND"],["NC.SCSI","333","RECALL"],
 ["NC.RAID","444","PEAK"],["NC.SLI","555","ABWEHR"],["NC.ATTACK","666","ENERGIE"],
 ["NC.DEFEND","777","CO2"],["NC.FUSION","888","ATOM"],["NC.HOME","999","BENCH"]
];
let step=0, auto=false, R={}, busy=false;
const $=id=>document.getElementById(id), log=$("log");
const cx=130,cy=130,rad=105, P=[];
for(let i=0;i<9;i++){const a=-Math.PI/2+i*2*Math.PI/9;P.push([cx+rad*Math.cos(a),cy+rad*Math.sin(a)]);}
$("nona").setAttribute("points",P.map(p=>p.join(",")).join(" "));
$("tri").setAttribute("points",[0,3,6].map(i=>P[i].join(",")).join(" "));
const NS="http://www.w3.org/2000/svg", vg=$("verts");
P.forEach((p,i)=>{
  const c=document.createElementNS(NS,"circle");
  c.setAttribute("cx",p[0]);c.setAttribute("cy",p[1]);c.setAttribute("r",9);c.setAttribute("class","v");c.id="v"+i;
  vg.appendChild(c);
  const t=document.createElementNS(NS,"text");
  const q=[cx+(rad+22)*Math.cos(-Math.PI/2+i*2*Math.PI/9),cy+(rad+22)*Math.sin(-Math.PI/2+i*2*Math.PI/9)+3];
  t.setAttribute("x",q[0]);t.setAttribute("y",q[1]);t.setAttribute("class","lb");t.textContent=ORDER[i][1];
  vg.appendChild(t);
});
function out(txt,cls){const d=document.createElement("div");d.className=cls||"";d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight;}
function render(){
  for(let i=0;i<9;i++){$("v"+i).setAttribute("class","v"+(i<step?" on":i===step?" cur":""));}
  $("tri").setAttribute("class","tri"+(step>=9?" on":""));
  $("sStep").textContent=step+"/9";
  $("sAuto").textContent=auto?"AN":"aus";
  $("sHome").textContent=R.home!==undefined?R.home:"–";
  const box=$("cmds");box.innerHTML="";
  ORDER.forEach((o,i)=>{
    const b=document.createElement("button");
    b.textContent=o[0];
    b.className=(i<step?"done":i===step?"next":"")+(o[0]==="NC.ATTACK"?" atk":"");
    b.onclick=()=>run(o[0]);box.appendChild(b);
  });
  ["NC.EXPORT","NC.RESET"].forEach(n=>{const b=document.createElement("button");b.textContent=n;if(n==="NC.EXPORT")b.className="ex";b.onclick=()=>run(n);box.appendChild(b);});
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const nums=()=>SRC.flatMap(s=>s.n);
const DO={
 "NC.ESSENZ":()=>{R={agent:"NOAH",HOME,formula:"f(x)=min(x,40)",rule:"f(40)=40"};out("Essenz geladen: f(x)=min(x,40), HOME 40","l-ok");},
 "NC.SCAN":()=>{R.scan=SRC.map(s=>({id:s.id,count:s.n.length}));out("5 Quellen gesehen: "+SRC.map(s=>s.id+"("+s.n.length+")").join(" · "),"l-ok");},
 "NC.SCSI":()=>{
   R.scsi=SRC.map(s=>({id:s.id,delta:+s.n.reduce((a,x)=>a+(x-f(x)),0).toFixed(2)}));
   out("SCSI trennt 5 Quellen, kein silent merge. Deltas: "+R.scsi.map(d=>d.delta).join(" | "),"l-ok");},
 "NC.RAID":()=>{
   const g=[SRC.slice(0,3),SRC.slice(3)];
   R.raid=g.map((grp,i)=>{const all=grp.flatMap(s=>s.n);return{group:i,sources:grp.length,merged:f(Math.min(...all)),avg:+(all.reduce((a,x)=>a+x,0)/all.length).toFixed(2)};});
   out("RAID spiegelt "+g.length+" Gruppen (3→1 / Rest): merged="+R.raid.map(r=>r.merged).join(","),"l-ok");},
 "NC.SLI":()=>{
   const m=Math.min(...R.raid.map(r=>r.merged));
   R.sli={final:f(m),parts:R.raid.length};
   out("SLI führt "+R.sli.parts+" Teile zusammen → "+R.sli.final,"l-ok");},
 "NC.ATTACK":()=>{
   const all=nums(), hit=all.filter(x=>x>HOME);
   R.attack={values:all.length,clamped:hit.length,max:Math.max(...all)};
   auto=true;
   out("AUTO ATTACK an: "+hit.length+" von "+all.length+" Werten über 40 → auf 40 gedrückt (Max "+R.attack.max+")","l-hi");},
 "NC.DEFEND":()=>{
   const all=nums(), masked=all.filter(x=>x>HOME).length;
   R.defend={mask:"Wright TMP Rär Maske",masked,passed:all.length-masked};
   out("Maske an: "+masked+" Werte maskiert, "+R.defend.passed+" durchgelassen","l-ok");},
 "NC.FUSION":()=>{
   const all=nums(), ok=all.filter(idem).length;
   R.fusion={check:"f(f(x))=f(x)",tested:all.length,idempotent:ok,all:ok===all.length};
   out("Fusion: f(f(x))=f(x) für "+ok+"/"+all.length+" Werte. (gilt bei min(x,40) per Definition)","l-ok");},
 "NC.HOME":()=>{
   R.home=HOME;R.final=f(f(f(R.sli.final)));R.timestamp=new Date().toISOString();
   out("HOME "+HOME+" – fertig. Mit NC.EXPORT sichern.","l-hi");}
};
async function run(raw){
  if(busy)return;
  let c=String(raw).trim().toUpperCase();
  if(!c)return;
  if(!c.startsWith("NC."))c="NC."+c;
  if(c==="NC.RESET"){step=0;auto=false;R={};log.innerHTML="";$("out").hidden=true;out("Zurück zu ESSENZ.","l-in");render();return;}
  if(c==="NC.EXPORT"){return exp();}
  const idx=ORDER.findIndex(o=>o[0]===c);
  if(idx<0){out("Unbekannt: "+c,"l-er");return;}
  if(idx!==step){
    out(step>=9?"Schon fertig. NC.EXPORT oder NC.RESET.":"Erwartet: "+ORDER[step][0]+" (nicht "+c+")","l-er");return;}
  busy=true;
  out("> "+c+"   # "+ORDER[idx][1]+" "+ORDER[idx][2],"l-in");
  DO[c]();step++;render();
  while(auto&&step<9){
    await sleep(350);
    const n=ORDER[step][0];
    out("> "+n+"   # "+ORDER[step][1]+" "+ORDER[step][2],"l-in");
    DO[n]();step++;render();
  }
  if(step>=9)auto=false,render();
  busy=false;
}
function exp(){
  if(step<9){out("Export erst nach NC.HOME.","l-er");return;}
  const txt=JSON.stringify(R,null,2), o=$("out");
  o.textContent=txt;o.hidden=false;
  const fallback=()=>{const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand("copy");out("Kopiert.","l-ok");}catch(e){out("Kopieren nicht möglich – Text unten markieren.","l-er");}t.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>out("Kopiert.","l-ok"),fallback);}else fallback();
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));
    a.download="NC-HOME-40.json";document.body.appendChild(a);a.click();a.remove();
    out("Download: NC-HOME-40.json","l-ok");
  }catch(e){out("Download blockiert – Text unten kopieren.","l-er");}
}
$("go").onclick=()=>{run($("inp").value);$("inp").value="";};
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter"){run(e.target.value);e.target.value="";}});
out("NC bereit. Start: NC.ESSENZ – oder NC.ATTACK ab Schritt 6, dann läuft der Rest automatisch.","l-in");
render();
})();
</script>
</body>
</html>
