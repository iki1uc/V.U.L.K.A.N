:root{
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
  --ink:#f2efe8;
  --muted:#8a9bb0;
  --red:#ff2d55;
  --gold:#e8b64c;
  --cyan:#37d5e8;
  --panel:#12121a;
  --line:#262635;
  --bg:#0a0a0e;
  --display:"Space Grotesk",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}

@media (prefers-color-scheme: dark){
  :root{
    --ink:#f2efe8;
    --muted:#8a9bb0;
    --panel:#12121a;
    --line:#262635;
    --bg:#0a0a0e;
  }
}

*{
  box-sizing:border-box
}

html,body,#root{
  min-height:100%
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--display);
}

.app-shell{
  min-height:100vh;
  width:100%;
  background:var(--bg);
  padding-top:var(--safe-area-inset-top);
  overflow-x:clip;
}

button:not(:disabled),[role="button"]:not([aria-disabled="true"]),label[for],select:not(:disabled),summary{
  cursor:pointer
}

button{
  font-family:inherit
}

input{
  font-family:inherit;
  color:inherit
}

.eyebrow{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.18em;
  color:var(--gold);
  font-weight:700
}

.chip{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border:1px solid var(--line);
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.12em;
  color:var(--muted);
  background:rgba(0,0,0,.25)
}

.chip-gold{
  border-color:var(--gold);
  color:var(--gold);
  background:rgba(232,182,76,.07)
}

.btn-gold{
  background:var(--gold);
  color:#111;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:.1em;
  padding:10px 14px;
  border:1px solid var(--gold)
}

.btn-ghost{
  border:1px solid var(--line);
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.1em;
  padding:10px 14px;
  color:var(--ink);
  background:transparent
}

.btn-gold:hover,.btn-ghost:hover{
  filter:brightness(1.15)
}

.heart-badge{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border:1px solid var(--red);
  color:var(--red);
  background:rgba(255,45,85,.1);
  flex-shrink:0
}

.dir-active{
  outline:2px solid var(--gold);
  outline-offset:-1px
}

.cell{
  aspect-ratio:1/1;
  min-width:0;
  border:1px solid var(--line);
  background:#0b0b10;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:2px;
  line-height:1.1;
  transition:.12s
}

.cell:hover{
  border-color:var(--gold)
}

.cell-selected{
  border-color:var(--cyan)!important;
  background:rgba(55,213,232,.12)!important;
  outline:1px solid var(--cyan)
}

.cell-home{
  border-color:var(--red)!important;
  background:rgba(255,45,85,.14)!important;
  color:var(--red)
}

.cell-num{
  font-family:var(--mono);
  font-size:8px;
  letter-spacing:.05em;
  color:var(--muted)
}

.cell-name{
  font-family:var(--mono);
  font-size:7.5px;
  font-weight:700;
  word-break:break-word;
  text-align:center;
  overflow-wrap:anywhere
}

@media(min-width:768px){
  .cell-num{
    font-size:9px
  }

  .cell-name{
    font-size:9px
  }
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  margin-right:5px;
  vertical-align:middle
}

@keyframes heartPulse{
  0%,100%{
    transform:scale(1)
  }

  25%{
    transform:scale(1.22)
  }

  40%{
    transform:scale(1.05)
  }

  60%{
    transform:scale(1.18)
  }
}

.pulse-heart{
  color:var(--red);
  animation:heartPulse 1.6s ease-in-out infinite;
  display:inline-flex
}

@media (prefers-reduced-motion: reduce){
  .pulse-heart{
    animation:none
  }
}

.placeholder\:text-\[\#5a6a7e\]::-moz-placeholder{
  --tw-text-opacity: 1;
  color: rgb(90 106 126 / var(--tw-text-opacity, 1));
}

.placeholder\:text-\[\#5a6a7e\]::placeholder{
  --tw-text-opacity: 1;
  color: rgb(90 106 126 / var(--tw-text-opacity, 1));
}

.hover\:border-\[\#e8b64c\]:hover{
  --tw-border-opacity: 1;
  border-color: rgb(232 182 76 / var(--tw-border-opacity, 1));
}

@media (min-width: 768px){
  .md\:-mx-8{
    margin-left: -2rem;
    margin-right: -2rem;
  }

  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:flex-row{
    flex-direction: row;
  }

  .md\:p-4{
    padding: 1rem;
  }

  .md\:p-5{
    padding: 1.25rem;
  }

  .md\:px-8{
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .md\:text-\[11px\]{
    font-size: 11px;
  }

  .md\:text-\[26px\]{
    font-size: 26px;
  }

  .md\:text-\[30px\]{
    font-size: 30px;
  }
}

@media (min-width: 1024px){
  .lg\:sticky{
    position: sticky;
  }

  .lg\:top-\[110px\]{
    top: 110px;
  }

  .lg\:col-span-5{
    grid-column: span 5 / span 5;
  }

  .lg\:col-span-7{
    grid-column: span 7 / span 7;
  }

  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
