        :root {

        }
        *{box-sizing:border-box}
        .app-root{min-height:100vh;background:radial-gradient(120% 70% at 50% 0%, var(--sky-2) 0%, var(--sky) 55%, #B6E3FF 100%);color:var(--ink);font-family:"Comic Sans MS","Chalkboard SE",cursive,sans-serif;display:flex;flex-direction:column;align-items:center;padding-top:var(--safe-area-inset-top,0);overflow-x:hidden;position:relative;cursor:auto}

        .top-bar{width:min(1040px,94vw);margin:18px auto 6px;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink),0 12px 24px rgba(0,0,0,0.08);padding:12px 18px 10px;transform:rotate(-0.4deg);position:relative;z-index:2}
        .title{font-family:"Comic Sans MS","Chalkboard SE",cursive;font-size:clamp(26px,5vw,42px);line-height:0.95;letter-spacing:0.02em;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
        .title .vulkan{font-weight:800;background:linear-gradient(90deg,#FF6B9E,#FFD93D,#6BCB77,#4D96FF);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.2px var(--ink);text-shadow:2px 2px 0 var(--ink);letter-spacing:0.12em}
        .subtitle{margin-top:4px;font-size:15px;opacity:0.8;font-family:"Comic Sans MS",cursive}
        .lauf-bubble{margin-top:10px;display:inline-flex;align-items:center;gap:8px;background:#fff;border:2.5px dashed #2B2E36;border-radius:999px;padding:6px 14px;font-weight:700;font-size:16px;box-shadow:3px 3px 0 rgba(0,0,0,0.12);transform:rotate(0.6deg)}
        .playground-wrap{width:min(1040px,96vw);margin:10px auto;display:grid;grid-template-columns:1.25fr 0.75fr;gap:14px;position:relative;z-index:1}
        @media(max-width:860px){.playground-wrap{grid-template-columns:1fr}}
        .board-card{background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--ink);overflow:hidden;position:relative;min-height:620px}
        .board-sky{height:68px;background:linear-gradient(180deg,#C9EFFF 0%,#E9F6FF 100%);border-bottom:3px dashed #2B2E36;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-family:"Comic Sans MS",cursive;position:relative}
        .ausgang-badge{background:var(--yellow);border:2.5px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:800;box-shadow:2px 2px 0 var(--ink);transform:rotate(-1deg)}
        .asphalt-area{background:radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,0.18) 0%,transparent 60%),radial-gradient(90% 60% at 80% 80%,rgba(0,0,0,0.12) 0%,transparent 60%),linear-gradient(180deg,var(--asphalt-2),var(--asphalt));position:relative;height:560px;overflow:hidden}
        .asphalt-area::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,0.12) 0 1px,transparent 1px),radial-gradient(circle at 70% 60%,rgba(255,255,255,0.10) 0 1px,transparent 1px),radial-gradient(circle at 40% 80%,rgba(0,0,0,0.12) 0 1.2px,transparent 1.2px);background-size:42px 42px,56px 56px,38px 38px;opacity:0.8;pointer-events:none}
        .doodle{position:absolute;font-family:"Comic Sans MS",cursive;color:rgba(255,254,247,0.55);font-size:22px;transform:rotate(-8deg);pointer-events:none}
        .hopscotch-board{position:absolute;inset:14px}

        .chalk-field::after{content:"";position:absolute;inset:-3px;border-radius:20px;border:2px dashed rgba(255,254,247,0.55);pointer-events:none}
        .chalk-field:hover{transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1.06);background:rgba(255,254,247,0.12)}
        .chalk-field.active{background:rgba(255,255,255,0.18);box-shadow:0 0 0 3px var(--yellow) inset,3px 4px 0 rgba(0,0,0,0.18);border-color:var(--yellow)}
        .chalk-field.pop{animation:pop 0.28s ease}
        @keyframes pop{0%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.18)}100%{transform:translate(-50%,-50%) scale(1)}}
        .field-num{position:absolute;top:6px;left:8px;font-family:"Comic Sans MS",cursive;font-weight:800;font-size:22px;color:var(--chalk);text-shadow:1px 1px 0 rgba(0,0,0,0.35);line-height:1}

        .kid-figure{position:relative;width:100%;height:100%}

        .kid-body-wrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center}
        .kid-head{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);position:relative;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 var(--ink)}
        .hair{position:absolute;top:-6px;left:-4px;right:-4px;height:14px;border-radius:12px 12px 6px 6px;border:2px solid var(--ink)}

        .kid-gaze-line{position:absolute;left:16px;top:12px;width:38px;height:2px;background:repeating-linear-gradient(90deg,#2B2E36 0 4px,transparent 4px 7px);transform-origin:left center;pointer-events:none}
        .smile{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:12px;height:6px;border-bottom:2px solid var(--ink);border-radius:0 0 8px 8px}
        .kid-torso{width:36px;height:24px;border-radius:10px 10px 8px 8px;border:2.5px solid var(--ink);margin-top:-4px;position:relative;box-shadow:2px 2px 0 var(--ink)}

        .kid-legs{display:flex;gap:6px;margin-top:2px}
        .leg{width:10px;height:14px;background:#5B5E66;border:2px solid var(--ink);border-radius:6px;display:block}
        .kid-label{position:absolute;top:-18px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:2px 2px 0 var(--ink)}

        .side-col{display:flex;flex-direction:column;gap:14px}
        .info-card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:14px 16px;position:relative}
        .info-card h3{font-family:"Comic Sans MS",cursive;font-size:20px;margin:0 0 8px}
        .star-legend{display:flex;flex-wrap:wrap;gap:8px}
        .legend-item{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;box-shadow:2px 2px 0 rgba(0,0,0,0.08)}
